[project]
name = "uv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "gan15087", email = "77959986+gan15087@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
uv = "uv:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
